name: Deploy portfolio to S3 + CloudFront

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236195543546:role/vedant-portfolio-gh-deploy
          aws-region: eu-west-1

      - name: Sync site to S3
        run: |
          aws s3 sync . s3://vedant-portfolio-65e132 --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "aws-portfolio-iac/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EFVB9QURN11JE \
            --paths "/*"
